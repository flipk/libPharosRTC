<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>libPharosRTC Browser Demo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #111827;
      color: #f3f4f6;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      color: #60a5fa;
      margin-bottom: 20px;
    }
    .card {
      background: #1f2937;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #374151;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
    input[type="text"], input[type="file"], button {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #4b5563;
      background: #374151;
      color: #fff;
      font-size: 14px;
    }
    button {
      background: #2563eb;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background: #1d4ed8;
    }
    .log-box {
      background: #000;
      color: #10b981;
      font-family: monospace;
      padding: 12px;
      height: 180px;
      overflow-y: auto;
      border-radius: 6px;
      font-size: 13px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .stat-card {
      background: #111827;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #374151;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>libPharosRTC Demo SPA</h1>

    <div class="card">
      <h2>1. Signaling & Connection</h2>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="wsUrl" value="ws://localhost:8765/ws/webrtc" style="flex: 1;" />
        <button id="btnConnect">Connect</button>
        <button id="btnDisconnect" style="background: #dc2626;">Disconnect</button>
      </div>
      <div id="connStatus" style="margin-top: 10px; color: #9ca3af;">Status: Disconnected</div>
    </div>

    <div class="card">
      <h2>2. Command & Control (ChID 0)</h2>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="c2Input" placeholder="Enter C2 Command..." style="flex: 1;" />
        <button id="btnSendC2">Send C2 Command</button>
      </div>
      <h3>C2 Received Messages</h3>
      <div id="c2Logs" class="log-box"></div>
    </div>

    <div class="card">
      <h2>3. File Transfer (ChID 2)</h2>
      <div style="display: flex; gap: 10px; align-items: center;">
        <input type="file" id="fileInput" style="flex: 1;" />
        <button id="btnSendFile">Upload File</button>
      </div>
      <progress id="fileProgress" value="0" max="100" style="width: 100%; margin-top: 12px;"></progress>
    </div>

    <div class="card">
      <h2>4. Real-time Telemetry & Stats</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <div>TX Frames</div>
          <strong id="statTx">0</strong>
        </div>
        <div class="stat-card">
          <div>RX Frames</div>
          <strong id="statRx">0</strong>
        </div>
        <div class="stat-card">
          <div>Retransmissions</div>
          <strong id="statRetx">0</strong>
        </div>
        <div class="stat-card">
          <div>Smoothed RTT</div>
          <strong id="statRtt">0 ms</strong>
        </div>
        <div class="stat-card">
          <div>Current RTO</div>
          <strong id="statRto">60 ms</strong>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/ts/demo.ts"></script>
</body>
</html>
